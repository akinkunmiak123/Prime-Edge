  <text x="200" y="178" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="6" fill="#170df2" style="fill:rgb(23, 13, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:44px;font-weight:700;text-anchor:start;dominant-baseline:auto">EDGE</text>

